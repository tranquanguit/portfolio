name: Deploy

# Builds the site and publishes it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the site
        run: python3 tools/build.py

      - name: Check internal links and page structure
        run: python3 tools/check.py

      - name: Stage the files to publish
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'content' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.md' \
            ./ _site/
          # README.md and DEPLOY.md are repository docs, not pages; the excludes
          # above drop them. Everything the browser needs is already generated.
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/.nojekyll
          echo "Staged $(find _site -type f | wc -l) files."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
